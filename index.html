<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Peitho</title>
        <meta name="description" content="A language model small enough to paste into a text box.">
        <!-- GitHub Pages serves this for the bare folder URL, so the short link
             works. The chat itself lives in peitho.html, which every doc and test
             refers to by name. The link below is not decoration: it is what a
             reader gets if the refresh is blocked. -->
        <meta http-equiv="refresh" content="0; url=peitho.html">
        <style>
            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                gap: 14px;
                align-items: center;
                justify-content: center;
                background: rgb(15, 17, 22);
                color: rgb(232, 234, 240);
                font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
                text-align: center;
                padding: 24px;
            }
            h1 {
                font-family: Georgia, "Iowan Old Style", serif;
                font-size: 2.1rem;
                font-weight: 400;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                margin: 0;
            }
            p {
                color: rgb(136, 143, 160);
                margin: 0;
            }
            a {
                color: rgb(214, 172, 110);
            }
            @media (prefers-color-scheme: light) {
                body {
                    background: rgb(249, 247, 243);
                    color: rgb(30, 32, 38);
                }
                p {
                    color: rgb(112, 116, 128);
                }
                a {
                    color: rgb(163, 110, 56);
                }
            }
        </style>
    </head>
    <body>
        <h1>Peitho</h1>
        <p>A language model small enough to paste into a text box.</p>
        <p><a href="peitho.html">Open the chat</a> &middot;
           <a href="https://github.com/SwankyMan88/Peitho-SLM">Source on GitHub</a></p>
    </body>
</html>
