name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU wheels only. The suite trains a tiny model for 20 steps, so the CUDA
      # build would add a gigabyte of download for nothing.
      - name: Install
        run: |
          pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Corpus, training, export, pure-Python inference
        run: python tests/test_slm.py

      - name: The page names it probes for still match the export naming
        run: |
          python - <<'EOF'
          import re, versions
          html = open("peitho.html", encoding="utf-8").read()
          bases = re.search(r"const BASES = \[(.*?)\]", html).group(1)
          for base, version in versions.existing():
              assert f'"{base}"' in bases, f"peitho.html never asks for {base}_* models"
              major, minor = version[0], version[1] if len(version) > 1 else 0
              majors = int(re.search(r"const MAJORS = (\d+)", html).group(1))
              minors = int(re.search(r"const MINORS = (\d+)", html).group(1))
              assert major <= majors and minor < minors, f"{base}_{versions.format_version(version)} is outside the probed range"
              print(f"  peitho.html would find {base}_{versions.format_version(version)}")
          EOF

      - name: Exports still load and still fit the size budget
        run: |
          python - <<'EOF'
          import os, versions
          from export import import_compressed
          for base, version in versions.existing():
              path = versions.path_for(base, version)
              model, config, stoi, itos = import_compressed(path, device="cpu")
              size = os.path.getsize(path)
              print(f"{path}: {size:,} bytes, "
                    f"{sum(p.numel() for p in model.parameters()):,} params")
          # Only the small export has to fit a page that carries its own weights.
          small = versions.resolve("small")
          size = os.path.getsize(small)
          assert size < 520_000, f"{small} is {size:,} bytes; the pasted-in target allows ~509 KB"
          print(f"{small} fits the pasted-in budget at {size:,} bytes")
          EOF
