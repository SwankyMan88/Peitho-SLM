<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Peitho</title>
        <style>
            :root {
                --bg: rgb(15, 17, 22);
                --glow: rgb(28, 32, 44);
                --panel: rgb(23, 26, 34);
                --edge: rgb(41, 46, 58);
                --ink: rgb(232, 234, 240);
                --dim: rgb(136, 143, 160);
                --accent: rgb(214, 172, 110);
                --mine: rgb(43, 50, 68);
                --shadow: rgba(0, 0, 0, 0.35);
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: rgb(249, 247, 243);
                    --glow: rgb(255, 255, 255);
                    --panel: rgb(255, 255, 255);
                    --edge: rgb(228, 222, 212);
                    --ink: rgb(30, 32, 38);
                    --dim: rgb(112, 116, 128);
                    --accent: rgb(163, 110, 56);
                    --mine: rgb(240, 236, 228);
                    --shadow: rgba(60, 50, 40, 0.09);
                }
            }
            * {
                box-sizing: border-box;
            }
            html {
                height: 100%;
            }
            body {
                margin: 0;
                padding: 28px 20px 24px;
                background: radial-gradient(1100px 520px at 50% -140px, var(--glow), var(--bg) 70%);
                background-color: var(--bg);
                color: var(--ink);
                font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
                height: 100dvh;
                overflow: hidden;
                display: flex;
                justify-content: center;
            }
            /* The page itself never scrolls; the log is the only scrollable region,
               so a long conversation cannot push the composer off screen. */
            .wrap {
                width: 100%;
                max-width: 720px;
                height: 100%;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            header {
                flex: none;
                text-align: center;
                overflow: hidden;
                transition: opacity 420ms ease, filter 420ms ease,
                            max-height 420ms ease, margin-bottom 420ms ease;
                max-height: 90px;
                margin-bottom: 18px;
            }
            /* Once the log has more than a screenful, the wordmark blurs away and
               gives its space to the conversation. */
            header.receded {
                opacity: 0;
                filter: blur(6px);
                max-height: 0;
                margin-bottom: 0;
                pointer-events: none;
            }
            h1 {
                font-family: Georgia, "Iowan Old Style", serif;
                font-size: 2.1rem;
                font-weight: 400;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                margin: 0;
            }
            /* The log holds the only scrollbar on the page, and it is drawn by
               hand: a native one cannot be animated between two widths. */
            .reader {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
            }
            #log {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 12px;
                overflow-y: auto;
                overscroll-behavior: contain;
                padding: 4px 14px 8px 2px;
                scrollbar-width: none;
            }
            #log::-webkit-scrollbar {
                width: 0;
                height: 0;
            }
            .rail {
                position: absolute;
                top: 4px;
                right: 0;
                bottom: 8px;
                width: 12px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 300ms ease;
            }
            .rail.shown {
                opacity: 1;
                pointer-events: auto;
            }
            .thumb {
                position: absolute;
                right: 5px;
                width: 2px;
                min-height: 28px;
                border-radius: 999px;
                background: var(--edge);
                transition: width 260ms ease, right 260ms ease, background-color 260ms ease;
            }
            .rail.awake .thumb,
            .rail:hover .thumb {
                width: 8px;
                right: 2px;
                background: var(--dim);
            }
            .empty {
                color: var(--dim);
                text-align: center;
                margin: auto;
                font-size: 0.95rem;
                max-width: 34ch;
                line-height: 1.7;
                transition: opacity 600ms ease;
            }
            /* Faded out while the next greeting is being written, so it changes
               without the text visibly rewriting itself character by character. */
            .empty.fading {
                opacity: 0;
            }
            /* What you said is a bubble; what it said is just the page talking back,
               so its turns carry no box, no border and no name - only the text. */
            .turn {
                max-width: 78%;
                padding: 10px 14px;
                border-radius: 16px;
                box-shadow: 0 1px 3px var(--shadow);
            }
            .turn.mine {
                align-self: flex-end;
                background: var(--mine);
                border-bottom-right-radius: 5px;
            }
            .turn.theirs {
                align-self: stretch;
                max-width: 100%;
                padding: 2px 2px 10px;
                background: none;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
            .who {
                display: none;
            }
            .body {
                white-space: pre-wrap;
                word-break: break-word;
            }
            /* Working out, not a reply. Quiet, smaller, and set apart, because it is
               there to be glanced at rather than read. */
            /* `hidden` works by a user-agent display:none rule, and any author rule
               beats it - so this element needs its own, or setting .hidden does
               nothing and a hidden thought stays on screen. */
            .thought[hidden] {
                display: none;
            }
            .thought {
                display: block;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--dim);
                font-size: 0.93rem;
                line-height: 1.7;
                border-left: 2px solid var(--edge);
                padding-left: 14px;
                margin: 2px 0 10px;
            }
            /* Shown while it is drafting replies it may throw away. The mark is an
               inline SVG rather than an image or a GIF: no second file to host, it
               takes its colour from the page, and it survives being pasted into a
               sandbox that allows no assets - the Khan page among them. */
            .working {
                display: flex;
                align-items: center;
                gap: 10px;
                color: var(--dim);
            }
            .spark {
                width: 22px;
                height: 22px;
                flex: none;
            }
            .spark .ring,
            .spark .core {
                transform-box: fill-box;
                transform-origin: 50% 50%;
            }
            .spark .ring {
                fill: none;
                stroke: var(--accent);
                stroke-width: 2;
                stroke-linecap: round;
                stroke-dasharray: 30 24;
                opacity: 0.8;
                animation: spin 1.5s linear infinite;
            }
            .spark .core {
                fill: var(--accent);
                animation: beat 1.5s ease-in-out infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes beat {
                0%, 100% {
                    transform: scale(0.7);
                    opacity: 0.5;
                }
                50% {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            .working .count {
                font-variant-numeric: tabular-nums;
                opacity: 0.75;
            }
            /* The finished reply arrives rather than blinking into place. */
            .arrive {
                animation: arrive 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            @keyframes arrive {
                from {
                    opacity: 0;
                    transform: scale(0.97) translateY(5px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .spark .ring,
                .spark .core,
                .arrive {
                    animation: none;
                }
            }
            .thought .label {
                display: block;
                font-size: 0.62rem;
                font-style: normal;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                margin-bottom: 2px;
            }
            /* A quiet tag beside the name, so a reply that was worked out is
               marked as such even when the working itself is hidden. */
            .who .thought-tag {
                margin-left: 7px;
                padding: 1px 6px;
                border: 1px solid var(--edge);
                border-radius: 999px;
                color: var(--dim);
                font-size: 0.9em;
                letter-spacing: 0.08em;
            }
            .switch {
                justify-content: space-between;
            }
            .switch input {
                accent-color: var(--accent);
                width: 16px;
                height: 16px;
            }
            .streaming .body::after {
                content: "";
                display: inline-block;
                width: 0.5em;
                height: 1em;
                margin-left: 2px;
                vertical-align: text-bottom;
                background: var(--accent);
                animation: blink 1.1s steps(1) infinite;
            }
            @keyframes blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }
            .composer {
                flex: none;
                margin-top: 16px;
                background: var(--panel);
                border: 1px solid var(--edge);
                border-radius: 16px;
                padding: 14px;
                box-shadow: 0 2px 10px var(--shadow);
            }
            .row {
                display: flex;
                gap: 10px;
            }
            /* Clear and Settings sit on their own line so the text box keeps the
               full width. On a phone, four controls in one row left the input
               barely wider than its placeholder. */
            .tools {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                margin-top: 10px;
            }
            input[type=text] {
                flex: 1;
                min-width: 0;
                background: transparent;
                color: var(--ink);
                border: 1px solid var(--edge);
                border-radius: 11px;
                padding: 12px 13px;
                font-family: inherit;
                /* Never below 16px: iOS Safari zooms the whole page in on focus
                   when a field's text is smaller than that. */
                font-size: max(16px, 1rem);
            }
            input[type=text]:focus {
                outline: none;
                border-color: var(--accent);
            }
            button {
                border: 0;
                border-radius: 11px;
                padding: 11px 20px;
                font: inherit;
                font-weight: 600;
                letter-spacing: 0.02em;
                cursor: pointer;
                background: var(--accent);
                color: rgb(22, 20, 16);
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            /* Small, quiet and out of the way, but still a comfortable tap. */
            .tools button {
                background: transparent;
                color: var(--dim);
                border: 1px solid var(--edge);
                border-radius: 9px;
                padding: 7px 13px;
                min-height: 34px;
                font-size: 0.8rem;
                font-weight: 400;
                letter-spacing: 0.04em;
            }
            .tools button.icon {
                font-size: 0.95rem;
                line-height: 1;
                padding: 7px 11px;
            }
            .panel {
                position: relative;
            }
            .settings {
                position: absolute;
                right: 0;
                bottom: calc(100% + 10px);
                width: min(320px, calc(100vw - 56px));
                background: var(--panel);
                border: 1px solid var(--edge);
                border-radius: 14px;
                padding: 14px 16px;
                box-shadow: 0 8px 26px var(--shadow);
                z-index: 5;
                transition: opacity 160ms ease, transform 160ms ease;
            }
            .settings[hidden] {
                display: block;
                opacity: 0;
                transform: translateY(6px);
                pointer-events: none;
            }
            .settings h2 {
                font-size: 0.7rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--dim);
                font-weight: 400;
                margin: 0 0 10px;
            }
            .tune label {
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: space-between;
                font-size: 0.82rem;
                color: var(--dim);
                margin-bottom: 10px;
            }
            .tune output {
                color: var(--ink);
                font-variant-numeric: tabular-nums;
                min-width: 2.4em;
                text-align: right;
            }
            input[type=range] {
                width: 130px;
                accent-color: var(--accent);
            }
            .picker {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 12px;
            }
            .picker button {
                flex: 1 1 30%;
                padding: 8px 4px;
                font-size: 0.78rem;
                letter-spacing: 0.04em;
                background: transparent;
                color: var(--dim);
                border: 1px solid var(--edge);
                border-radius: 9px;
                transition: color 160ms ease, border-color 160ms ease, opacity 160ms ease;
            }
            .picker button.active {
                color: var(--ink);
                border-color: var(--accent);
            }
            /* Unreachable models stay clickable so a click can explain why, but
               read as unavailable and say so on hover. */
            .picker button.off {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .picker button .size {
                display: block;
                font-size: 0.68rem;
                opacity: 0.7;
            }
            .linkish {
                width: 100%;
                margin-bottom: 12px;
                padding: 7px 10px;
                font-size: 0.75rem;
                background: transparent;
                color: var(--dim);
                border: 1px dashed var(--edge);
                border-radius: 9px;
            }
            /* The smaller models, in a popup over the settings panel. */
            .more {
                position: absolute;
                inset: 0;
                overflow-y: auto;
                background: var(--panel);
                border-radius: 14px;
                padding: 14px 16px;
                z-index: 6;
            }
            .more[hidden] {
                display: none;
            }
            .more .head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
            }
            .more .head h2 {
                margin: 0;
            }
            .more .head button {
                width: auto;
                margin: 0;
            }
            /* Effort: how many times the model draws each letter before writing it.
               Its own popup, and a slider drawn by hand - a native range input cannot
               show five named stops without looking like a form control. */
            .effort {
                position: absolute;
                right: 0;
                bottom: calc(100% + 10px);
                width: min(320px, calc(100vw - 56px));
                background: var(--panel);
                border: 1px solid var(--edge);
                border-radius: 14px;
                padding: 14px 16px 10px;
                box-shadow: 0 8px 26px var(--shadow);
                z-index: 5;
            }
            .effort[hidden] {
                display: none;
            }
            .effort h2 {
                font-size: 0.7rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--dim);
                font-weight: 400;
                margin: 0 0 14px;
            }
            .slider {
                position: relative;
                height: 40px;
                margin: 0 10px;
                cursor: pointer;
                touch-action: none;
            }
            .slider:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 6px;
                border-radius: 4px;
            }
            .track {
                position: absolute;
                top: 9px;
                left: 0;
                right: 0;
                height: 4px;
                border-radius: 999px;
                background: var(--edge);
            }
            .fill {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                border-radius: 999px;
                background: var(--accent);
                transition: width 140ms ease;
            }
            /* Stops are appended after the thumb, so the thumb is lifted over them
               here rather than by juggling the order they are created in. */
            .stop {
                position: absolute;
                z-index: 1;
                top: 6px;
                width: 10px;
                height: 10px;
                margin-left: -5px;
                border-radius: 50%;
                background: var(--edge);
                transition: background-color 140ms ease;
            }
            .stop.done {
                background: var(--accent);
            }
            /* A knob rather than a dot: the accent ringed against the panel, so it
               reads as the thing you take hold of. */
            .slider .thumb {
                position: absolute;
                z-index: 2;
                top: 1px;
                width: 18px;
                height: 18px;
                margin-left: -9px;
                border-radius: 50%;
                background: var(--accent);
                border: 3px solid var(--panel);
                box-shadow: 0 1px 5px var(--shadow);
                transition: left 140ms ease;
            }
            .ticks {
                position: absolute;
                top: 27px;
                left: 0;
                right: 0;
                height: 14px;
            }
            .tick {
                position: absolute;
                transform: translateX(-50%);
                font-size: 0.62rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--dim);
                white-space: nowrap;
            }
            .tick.on {
                color: var(--ink);
            }
            .note {
                color: var(--dim);
                font-size: 0.73rem;
                line-height: 1.5;
                margin-bottom: 12px;
                min-height: 1.5em;
            }
            .note.bad {
                color: var(--accent);
            }
            .facts {
                border-top: 1px solid var(--edge);
                padding-top: 10px;
                color: var(--dim);
                font-size: 0.76rem;
                line-height: 1.7;
            }
            .facts div {
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }
            .facts span:last-child {
                color: var(--ink);
                font-variant-numeric: tabular-nums;
            }
            .stats {
                margin-top: 10px;
                color: var(--dim);
                font-size: 0.76rem;
                font-variant-numeric: tabular-nums;
                min-height: 1.2em;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header id="header">
                <h1>Peitho</h1>
            </header>

            <div class="reader" id="reader">
                <div id="log"><div class="empty" id="empty">Say something to begin.</div></div>
                <div class="rail" id="rail"><div class="thumb" id="thumb"></div></div>
            </div>

            <div class="composer panel">
                <div class="settings" id="settings" hidden>
                    <h2>Model</h2>
                    <div class="picker" id="picker"></div>
                    <button class="linkish" id="more-open" hidden>Smaller models&hellip;</button>
                    <div class="note" id="note"></div>
                    <div class="more" id="more" hidden>
                        <div class="head">
                            <h2>Smaller models</h2>
                            <button class="linkish" id="more-close">Back</button>
                        </div>
                        <div class="picker" id="picker-more"></div>
                        <div class="note">Quicker to load and to run, and less capable. Small
                            is what opens if none of the main models can be reached.</div>
                    </div>
                    <div class="tune">
                        <label class="switch">Show the working
                            <input type="checkbox" id="working" checked>
                        </label>
                    </div>
                    <h2>Writing</h2>
                    <div class="tune">
                        <label>Variety
                            <input type="range" id="temp" min="0.1" max="1.5" step="0.05" value="0.7">
                            <output id="tempv">0.70</output>
                        </label>
                        <label>Words considered
                            <input type="range" id="topk" min="1" max="60" step="1" value="40">
                            <output id="topkv">40</output>
                        </label>
                    </div>
                    <div class="facts" id="facts"></div>
                    <div class="stats" id="stats"></div>
                </div>
                <div class="row">
                    <input type="text" id="msg" placeholder="Say something…" autocomplete="off">
                    <button id="send">Send</button>
                </div>
                <div class="effort" id="effort" hidden>
                    <h2>Effort</h2>
                    <div class="slider" id="slider" role="slider" tabindex="0"
                         aria-label="Effort" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
                        <div class="track"><div class="fill" id="fill"></div></div>
                        <div class="thumb" id="knob"></div>
                        <div class="ticks" id="ticks"></div>
                    </div>
                </div>
                <div class="tools">
                    <button id="gear" class="icon" title="Settings" aria-label="Settings">&#9881;</button>
                    <button id="dial" class="icon" title="Effort" aria-label="Effort">&#9878;</button>
                    <button id="clear">Clear</button>
                </div>
            </div>
        </div>

<script>
"use strict";


const START = "◈", USER = "▶", BOT = "◀", END = "■";
const THINK = "\u25c7";   /* the working stops here; a reply follows */

const B85 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz" +
            "!#$%&()*+-;<=>?@^_`{|}~";
const B85REV = new Int16Array(256).fill(-1);
for (let i = 0; i < B85.length; i++) {
    B85REV[B85.charCodeAt(i)] = i;
}

function dec85(text) {
    const s = text.replace(/\s+/g, "");
    const out = new Uint8Array(Math.floor(s.length * 4 / 5) + 4);
    let o = 0;
    for (let p = 0; p < s.length; p += 5) {
        const take = Math.min(5, s.length - p);
        let v = 0;
        for (let i = 0; i < 5; i++) {
            const c = i < take ? B85REV[s.charCodeAt(p + i)] : 84;
            if (c < 0) {
                throw new Error("bad base85 character at " + (p + i));
            }
            v = v * 85 + c;
        }
        // v reaches 85^5, past 2^32, so extract bytes by division not shifts.
        const b = [Math.floor(v / 16777216) % 256, Math.floor(v / 65536) % 256,
                   Math.floor(v / 256) % 256, v % 256];
        for (let k = 0; k < take - 1; k++) {
            out[o++] = b[k];
        }
    }
    return out.subarray(0, o);
}

function fp16(lo, hi) {
    const bits = lo | (hi << 8);
    const sign = (bits >> 15) ? -1 : 1;
    const exp = (bits >> 10) & 0x1f;
    const frac = bits & 0x3ff;
    if (exp === 0) {
        return sign * frac * Math.pow(2, -24);
    }
    if (exp === 31) {
        return sign * Infinity;
    }
    return sign * (1024 + frac) * Math.pow(2, exp - 25);
}

function layernorm(x, w, b, out) {
    const n = x.length;
    let mean = 0;
    for (let i = 0; i < n; i++) {
        mean += x[i];
    }
    mean /= n;
    let varsum = 0;
    for (let i = 0; i < n; i++) {
        const d = x[i] - mean;
        varsum += d * d;
    }
    const inv = 1 / Math.sqrt(varsum / n + 1e-5);
    for (let i = 0; i < n; i++) {
        out[i] = (x[i] - mean) * inv * w[i] + b[i];
    }
    return out;
}

function matvec(out, W, x, nOut, nIn, bias) {
    for (let o = 0; o < nOut; o++) {
        const base = o * nIn;
        let acc = bias ? bias[o] : 0;
        for (let i = 0; i < nIn; i++) {
            acc += W[base + i] * x[i];
        }
        out[o] = acc;
    }
    return out;
}

// Abramowitz & Stegun 7.1.26, max error 1.5e-7, to match PyTorch's exact gelu.
function erf(x) {
    const sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const poly = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
                 - 0.284496736) * t + 0.254829592) * t;
    return sign * (1 - poly * Math.exp(-x * x));
}

function gelu(v) {
    return 0.5 * v * (1 + erf(v / Math.SQRT2));
}

function softmax(a, n) {
    let m = -Infinity;
    for (let i = 0; i < n; i++) {
        if (a[i] > m) {
            m = a[i];
        }
    }
    let sum = 0;
    for (let i = 0; i < n; i++) {
        a[i] = Math.exp(a[i] - m);
        sum += a[i];
    }
    for (let i = 0; i < n; i++) {
        a[i] /= sum;
    }
    return a;
}

class Peitho {
    constructor(src) {
        const head = typeof src.header === "string" ? JSON.parse(src.header) : src.header;
        const wBytes = dec85(src.weights);
        const sBytes = dec85(src.scales);
        if (head.bits !== 4 && head.bits !== 8) {
            throw new Error("bits must be 4 or 8");
        }

        const cfg = head.config;
        this.C = cfg.n_embd;
        this.H = cfg.n_head;
        this.D = cfg.n_embd / cfg.n_head;
        this.nLayer = cfg.n_layer;
        this.block = cfg.block_size;
        this.vocabSize = cfg.vocab_size;
        this.bits = head.bits;
        this.vocab = head.vocab;
        this.stoi = {};
        for (let i = 0; i < this.vocab.length; i++) {
            this.stoi[this.vocab[i]] = i;
        }

        const scales = new Float32Array(sBytes.length >> 1);
        for (let i = 0; i < scales.length; i++) {
            scales[i] = fp16(sBytes[2 * i], sBytes[2 * i + 1]);
        }

        // Each weight is a small integer times the scale of its group of `group`
        // consecutive weights. Groups never straddle tensors, hence the padding.
        const group = head.group;
        this.T = {};
        this.nParams = 0;
        let at = 0, sAt = 0;
        for (const meta of head.tensors) {
            let numel = 1;
            for (const dim of meta.s) {
                numel *= dim;
            }
            const arr = new Float32Array(numel);
            for (let i = 0; i < numel; i++) {
                const idx = at + i;
                let q;
                if (this.bits === 8) {
                    q = wBytes[idx];
                    if (q > 127) {
                        q -= 256;
                    }
                } else {
                    const byte = wBytes[idx >> 1];
                    q = (idx & 1) ? (byte >> 4) : (byte & 15);
                    if (q > 7) {
                        q -= 16;
                    }
                }
                arr[i] = q * scales[sAt + ((i / group) | 0)];
            }
            this.T[meta.n] = arr;
            this.nParams += numel;
            const padded = numel + ((group - (numel % group)) % group);
            at += padded;
            sAt += padded / group;
        }
        this.reset();
    }

    reset() {
        this.cache = [];
        for (let i = 0; i < this.nLayer; i++) {
            this.cache.push({ k: [], v: [] });
        }
        this.pos = 0;
        const C = this.C;
        this.buf = {
            x: new Float32Array(C),
            h: new Float32Array(C),
            qkv: new Float32Array(3 * C),
            attn: new Float32Array(C),
            proj: new Float32Array(C),
            hid: new Float32Array(4 * C),
            down: new Float32Array(C),
            xf: new Float32Array(C),
            logits: new Float32Array(this.vocabSize)
        };
    }

    step(id) {
        const T = this.T, C = this.C, H = this.H, D = this.D, buf = this.buf;
        const tok = T["tok_emb.weight"], posE = T["pos_emb.weight"];
        const x = buf.x;
        const pos = Math.min(this.pos, this.block - 1);
        for (let i = 0; i < C; i++) {
            x[i] = tok[id * C + i] + posE[pos * C + i];
        }

        for (let L = 0; L < this.nLayer; L++) {
            const p = "blocks." + L + ".";
            layernorm(x, T[p + "ln1.weight"], T[p + "ln1.bias"], buf.h);
            const qkv = matvec(buf.qkv, T[p + "attn.qkv.weight"], buf.h,
                               3 * C, C, T[p + "attn.qkv.bias"]);

            const cache = this.cache[L];
            cache.k.push(qkv.slice(C, 2 * C));
            cache.v.push(qkv.slice(2 * C, 3 * C));
            if (cache.k.length > this.block) {
                cache.k.shift();
                cache.v.shift();
            }

            const n = cache.k.length;
            const scores = new Float32Array(n);
            const scale = 1 / Math.sqrt(D);
            buf.attn.fill(0);
            for (let hd = 0; hd < H; hd++) {
                const off = hd * D;
                for (let j = 0; j < n; j++) {
                    const kv = cache.k[j];
                    let acc = 0;
                    for (let d = 0; d < D; d++) {
                        acc += qkv[off + d] * kv[off + d];
                    }
                    scores[j] = acc * scale;
                }
                softmax(scores, n);
                for (let j = 0; j < n; j++) {
                    const w = scores[j];
                    const vv = cache.v[j];
                    for (let d = 0; d < D; d++) {
                        buf.attn[off + d] += w * vv[off + d];
                    }
                }
            }
            matvec(buf.proj, T[p + "attn.proj.weight"], buf.attn, C, C,
                   T[p + "attn.proj.bias"]);
            for (let i = 0; i < C; i++) {
                x[i] += buf.proj[i];
            }

            layernorm(x, T[p + "ln2.weight"], T[p + "ln2.bias"], buf.h);
            matvec(buf.hid, T[p + "mlp.fc.weight"], buf.h, 4 * C, C, T[p + "mlp.fc.bias"]);
            for (let i = 0; i < 4 * C; i++) {
                buf.hid[i] = gelu(buf.hid[i]);
            }
            matvec(buf.down, T[p + "mlp.proj.weight"], buf.hid, C, 4 * C,
                   T[p + "mlp.proj.bias"]);
            for (let i = 0; i < C; i++) {
                x[i] += buf.down[i];
            }
        }
        layernorm(x, T["ln_f.weight"], T["ln_f.bias"], buf.xf);
        // The output head shares the token embedding matrix.
        return matvec(buf.logits, tok, buf.xf, this.vocabSize, C, null);
    }

    feed(text) {
        let logits = null;
        for (const ch of text) {
            const id = this.stoi[ch];
            if (id === undefined) {
                continue;
            }
            logits = this.step(id);
            this.pos++;
        }
        return logits;
    }

    /* One draw from the distribution the temperature and top_k leave behind. */
    draw(a, n) {
        const r = Math.random();
        let acc = 0;
        for (let i = 0; i < n; i++) {
            acc += a[i];
            if (r <= acc) {
                return i;
            }
        }
        return n - 1;
    }

    /* One letter, drawn from what temperature and top_k leave standing.

       An earlier effort dial drew each letter several times and kept the best draw.
       It worked, but it cost nothing measurable - 0.0146 ms against 0.0148 ms per
       letter, next to 8.97 ms for the forward pass - so "more effort" bought no more
       thinking. Effort now drafts whole replies instead, which does cost what it
       claims to. */
    sample(logits, temp, topK) {
        const n = logits.length;
        const a = new Float32Array(n);
        const t = Math.max(temp, 1e-6);
        for (let i = 0; i < n; i++) {
            a[i] = logits[i] / t;
        }
        if (topK && topK < n) {
            const cut = Array.from(a).sort((x, y) => y - x)[topK - 1];
            for (let i = 0; i < n; i++) {
                if (a[i] < cut) {
                    a[i] = -1e30;
                }
            }
        }
        softmax(a, n);
        const id = this.draw(a, n);
        // What the model gave the letter it just chose. Kept so a finished draft can
        // be scored by how likely the model thought its own words were.
        this.lastProb = a[id];
        return id;
    }
}

/* The effort dial: how many whole replies are written before one is shown. Each
   draft is a full pass over the model, so Max really does take eight times as long
   as Low - the cost is the point. */
const EFFORT = [
    { name: "Low", drafts: 1 },
    { name: "Medium", drafts: 2 },
    { name: "High", drafts: 3 },
    { name: "Ultra", drafts: 5 },
    { name: "Max", drafts: 8 }
];
let effort = 0;

/* The slider is five stops rather than a continuous track: every position has a
   name, and a name is what the setting means. */
function setEffort(index) {
    effort = Math.min(EFFORT.length - 1, Math.max(0, index));
    const pct = (effort / (EFFORT.length - 1)) * 100;
    el("fill").style.width = pct + "%";
    el("knob").style.left = pct + "%";
    const slider = el("slider");
    slider.setAttribute("aria-valuenow", String(effort + 1));
    slider.setAttribute("aria-valuetext", EFFORT[effort].name);
    const stops = slider.querySelectorAll(".stop");
    for (let i = 0; i < stops.length; i++) {
        stops[i].classList.toggle("done", i <= effort);
    }
    const ticks = el("ticks").children;
    for (let i = 0; i < ticks.length; i++) {
        ticks[i].classList.toggle("on", i === effort);
    }
}

function buildSlider() {
    const slider = el("slider");
    const ticks = el("ticks");
    EFFORT.forEach((level, i) => {
        const pct = (i / (EFFORT.length - 1)) * 100;
        const stop = document.createElement("div");
        stop.className = "stop";
        stop.style.left = pct + "%";
        slider.append(stop);
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.left = pct + "%";
        tick.textContent = level.name;
        ticks.append(tick);
    });

    // Snap to the nearest stop, wherever the pointer lands or is dragged to.
    const pick = e => {
        const box = slider.getBoundingClientRect();
        const at = box.width ? (e.clientX - box.left) / box.width : 0;
        setEffort(Math.round(at * (EFFORT.length - 1)));
    };
    slider.addEventListener("pointerdown", e => {
        slider.setPointerCapture(e.pointerId);
        pick(e);
        e.preventDefault();
    });
    slider.addEventListener("pointermove", e => {
        if (slider.hasPointerCapture(e.pointerId)) {
            pick(e);
        }
    });
    slider.addEventListener("keydown", e => {
        const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key];
        if (step) {
            setEffort(effort + step);
            e.preventDefault();
        } else if (e.key === "Home" || e.key === "End") {
            setEffort(e.key === "Home" ? 0 : EFFORT.length - 1);
            e.preventDefault();
        }
    });
    setEffort(effort);
}

/* Every model is read from the models/ folder beside this page, so the page
   itself carries no weights and never has to be rebuilt when one changes.

   HTTP cannot list a directory and there is no index file to keep in step, so the
   names are worked out here instead: exports are called <base>_<major>.<minor>.txt,
   which is few enough shapes to just ask for. Asking needs a server - fetch
   refuses file:// for any sibling file - so opened straight off the disk the page
   says that rather than appearing broken. */
const FOLDER = "models/";
/* A separate 47K-parameter model trained only on greetings, so the empty page can
   open with something composed rather than a fixed string. It is excluded from the
   picker: it cannot answer anything, and offering it as a chat model would be a
   trap. */
const GREETER = "greeter_47k";
const GREET_EVERY = 30000;
/* "taught" is what slm/learn.py exports under: a released model plus whatever
   someone taught it live. Same format, same probe, no special case. */
/* Exports are named for what they are: the family, then how many weights they hold.
   "small_382k_1.5.txt" is version 1.5 of the 382,000-weight model. */
const BASES = ["small_382k", "medium_855k", "medium_think_855k", "large_2m8", "xl_4m1",
               "xxl_10m1", "xxxl_20m", "greeter_47k", "taught_2m8"];
/* Strongest first. The main list offers the newest version of each of these, and
   the page opens the first one it can load. Everything else - the smaller models,
   and older versions of these - sits behind "Smaller models". */
const STRONG = ["xxxl_20m", "xxl_10m1", "xl_4m1", "large_2m8", "taught_2m8"];
/* Opened only if nothing in the main list can be reached. */
const FALLBACK = "small_382k";
const MAJORS = 2;             /* how many major versions of each base to look for */
const MINORS = 10;            /* and how many minor versions of each of those */
const downloaded = {};
let greeter = null;
let greetAt = 0;
let choices = [];
let current = null;
let loading = false;

const painted = [];
let model = null;
let busy = false;
let log = null;
// Named chatTurns, not history: window.history is a getter-only accessor, so
// assigning a global `history` throws TypeError under strict mode.
let chatTurns = [];

function el(id) {
    return document.getElementById(id);
}

function buildPrompt(text, block) {
    const current = USER + text + END + "\n" + BOT;
    const kept = [];
    // Leave room for the reply. A prompt that fills the whole context pushes every
    // character of the reply past the last position the model was trained on, and it
    // degrades into nonsense a few words in - seen on the third turn of a chat with
    // xl_1.0. The mean reply and its working together run to about 135 characters.
    const room = Math.min(240, Math.floor(block * 0.4));
    const budget = block - room;
    // Four turns, because the hand-written conversations are mostly two to four
    // turns long. Feeding a longer history than anything in training pushes the
    // context off-distribution and the reply degrades partway through. A model with
    // a 768-character context trained on long dialogues and passage Q&A can hold far
    // more, so it keeps up to ten - that is where its longer memory shows.
    const WINDOW = block >= 768 ? 10 : 4;
    let dropped = chatTurns.length > WINDOW;
    for (let i = chatTurns.length - 1; i >= 0 && chatTurns.length - i <= WINDOW; i--) {
        const t = chatTurns[i];
        const line = (t.role === "user" ? USER : BOT) + t.text + END;
        if ([line, ...kept, current].join("\n").length > budget) {
            dropped = true;   // drop whole turns; a prompt starting mid-word is off-distribution
            break;
        }
        kept.unshift(line);
    }
    // START only when the opening of the conversation is still in view.
    const head = dropped ? [] : [START];
    return [...head, ...kept, current].join("\n").slice(-block);
}

/* The reply is what follows the think marker. The working before it is kept on the
   element but shown only when the setting asks for it - it is the model talking to
   itself, and most of the time a reader wants the answer.

   Until the marker arrives there is no way to tell working from reply, so a model
   that thinks gets an ellipsis rather than its working streamed into the answer and
   then yanked back out. */
function paint(bubble, text) {
    bubble.raw = text;
    const at = text.indexOf(THINK);
    const worked = at !== -1;
    const stillWorking = !worked && streaming(bubble) && thinks();
    const working = worked ? text.slice(0, at) : (stillWorking ? text : "");
    const said = worked ? text.slice(at + THINK.length) : (stillWorking ? "" : text);

    // "◀◇reply" thought nothing: the marker alone is not working worth a tag.
    tag(bubble, (worked && working.trim() !== "") || stillWorking);
    reveal(bubble, working);
    bubble.body.textContent = stillWorking && !showWorking() ? "\u2026" : said;
}

function streaming(bubble) {
    return !!bubble.div && bubble.div.classList.contains("streaming");
}

/* Whether the loaded model has the marker at all. Absent from its vocabulary, no
   reply of its can ever contain one. */
function thinks() {
    return !!(model && model.stoi && model.stoi[THINK] !== undefined);
}

function showWorking() {
    const box = el("working");
    return !!box && box.checked;
}

function tag(bubble, wanted) {
    if (wanted && !bubble.tag) {
        bubble.tag = document.createElement("span");
        bubble.tag.className = "thought-tag";
        bubble.tag.textContent = "Thought";
        bubble.who.append(bubble.tag);
    }
    if (bubble.tag) {
        bubble.tag.hidden = !wanted;
    }
}

function reveal(bubble, working) {
    if (working && showWorking()) {
        if (!bubble.thought) {
            bubble.thought = document.createElement("span");
            bubble.thought.className = "thought";
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = "thinking";
            bubble.thought.append(label);
            bubble.thought.append(document.createTextNode(""));
            bubble.body.before(bubble.thought);
        }
        bubble.thought.lastChild.textContent = working;
        bubble.thought.hidden = false;
    } else if (bubble.thought) {
        bubble.thought.hidden = true;
    }
}

/* Turning the setting on or off redraws what is already on screen, so the choice
   applies to the whole conversation rather than only the next reply. */
function repaintAll() {
    for (const bubble of painted) {
        paint(bubble, bubble.raw);
    }
    layout();
}



function addTurn(mine, text) {
    const empty = el("empty");
    if (empty) {
        empty.remove();
    }
    const div = document.createElement("div");
    div.className = "turn " + (mine ? "mine" : "theirs");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = mine ? "you" : "peitho";
    const body = document.createElement("span");
    body.className = "body";
    body.textContent = text;
    div.append(who, body);
    log.append(div);
    log.scrollTop = log.scrollHeight;
    layout();
    const bubble = { div, body, who, raw: text };
    if (!mine) {
        painted.push(bubble);
    }
    return bubble;
}

function finish(text, userText, bubble, started, drafts) {
    const ms = performance.now() - started;
    bubble.div.classList.remove("streaming");
    if (text.trim()) {
        paint(bubble, text);
    }
    el("stats").textContent = text.length + " chars · " +
        (text.length / (ms / 1000)).toFixed(0) + " chars/sec" +
        (drafts > 1 ? " · best of " + drafts + " drafts" : "");
    if (!text.trim()) {
        text = "(no reply)";
        bubble.body.textContent = text;
    }
    chatTurns.push({ role: "user", text: userText }, { role: "bot", text: text.trim() });
    busy = false;
    el("send").disabled = false;
}

function looping(text) {
    const tail = text.slice(-42);
    for (let n = 2; n <= 14; n++) {
        const unit = tail.slice(-n);
        if (unit.trim().length > 1 && tail.endsWith(unit.repeat(3))) {
            return true;
        }
    }
    // A stuttered word ("helps helps", "to to") is the same failure earlier on.
    return /\b(\w{1,12})\s+\1\b/.test(tail);
}

/* The mark that turns while it drafts: a ring with a gap, and the diamond from the
   conversation markers beating in the middle. Inline SVG, drawn in the page's own
   accent colour, so there is no file to fetch and nothing to break in a sandbox. */
const SPARK = '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true">'
    + '<circle class="ring" cx="12" cy="12" r="9"/>'
    + '<path class="core" d="M12 6.6 15.4 12 12 17.4 8.6 12Z"/></svg>';

/* Named for what it shows, not for the setting: showWorking() already means "is the
   Show the working switch on", and shadowing it broke every painted reply. */
function showDrafting(bubble, made, total) {
    if (!bubble.work) {
        bubble.body.textContent = "";
        bubble.work = document.createElement("span");
        bubble.work.className = "working";
        bubble.work.innerHTML = SPARK + "<span>Working through it</span>"
            + '<span class="count"></span>';
        bubble.body.append(bubble.work);
    }
    bubble.work.lastChild.textContent = total > 1 ? "(" + made + " of " + total + ")" : "";
}

/* Restarting the animation needs the class gone and the element measured in between,
   or the browser sees no change and plays nothing. */
function arrive(element) {
    element.classList.remove("arrive");
    void element.offsetWidth;
    element.classList.add("arrive");
}

/* Words and pairs of words, for asking how much two drafts say the same thing. */
function shingles(text) {
    const words = text.toLowerCase().match(/[a-z0-9]+/g) || [];
    const out = new Set(words);
    for (let i = 0; i + 1 < words.length; i++) {
        out.add(words[i] + " " + words[i + 1]);
    }
    return out;
}

function overlap(a, b) {
    if (!a.size || !b.size) {
        return 0;
    }
    let hit = 0;
    a.forEach(piece => {
        if (b.has(piece)) {
            hit++;
        }
    });
    return hit / a.size;
}

/* Which draft to show. Agreement first: the draft that says what the others say is
   the one the model keeps arriving at, and the odd one out - the booking confirmation
   among four answers about kettles - loses. Average probability breaks ties, because
   on open questions the drafts agree on little and the model's own confidence is
   then the only thing left to go on. It measures fluency, not truth: a confident
   wrong answer still wins. */
function pickDraft(drafts) {
    if (drafts.length === 1) {
        return drafts[0];
    }
    const bags = drafts.map(d => shingles(d.text));
    drafts.forEach((draft, i) => {
        let sum = 0;
        for (let j = 0; j < drafts.length; j++) {
            if (i !== j) {
                sum += (overlap(bags[i], bags[j]) + overlap(bags[j], bags[i])) / 2;
            }
        }
        draft.agreement = sum / (drafts.length - 1);
    });
    return drafts.slice().sort((x, y) =>
        (y.agreement - x.agreement) || (y.mean - x.mean))[0];
}

function reply(userText) {
    if (!model || busy) {
        return;
    }

    busy = true;
    el("send").disabled = true;

    let bubble, prompt, started;
    try {
        addTurn(true, userText);
        bubble = addTurn(false, "");
        bubble.div.classList.add("streaming");
        prompt = buildPrompt(userText, model.block);
        started = performance.now();
    } catch (e) {
        console.error(e);
        if (bubble) {
            bubble.div.classList.remove("streaming");
            bubble.body.textContent = "error: " + e.message;
        }
        busy = false;
        el("send").disabled = false;
        return;
    }

    const temp = parseFloat(el("temp").value);
    const topK = parseInt(el("topk").value, 10);
    const LIMIT = 300;
    const wanted = Math.max(1, EFFORT[effort].drafts);
    const drafts = [];
    let logits = null;
    let text = "";
    let logp = 0;
    let n = 0;

    // Above one draft the writing is not worth watching: the drafts are discarded,
    // and seeing four of them typed out and thrown away reads as the model changing
    // its mind. It says what it is doing instead, and only the winner is shown.
    const quiet = wanted > 1;

    // Each draft starts the model again from the same prompt, which is what makes
    // effort cost what it costs: eight drafts is eight passes over the model.
    function startDraft() {
        text = "";
        logp = 0;
        n = 0;
        model.reset();
        logits = model.feed(prompt);
        if (quiet) {
            showDrafting(bubble, drafts.length + 1, wanted);
            el("stats").textContent = "draft " + (drafts.length + 1) + " of " + wanted + "…";
        }
    }

    function tick() {
        // setTimeout rather than requestAnimationFrame: rAF is throttled to a
        // crawl whenever the tab is not the visible one.
        try {
            // Sixteen letters a frame arrived in visible bursts on a model this size.
            // A time budget instead: keep going until the frame is spent, so a slow
            // model paints one letter at a time and a fast one still keeps up.
            const until = performance.now() + 8;
            while (n < LIMIT && performance.now() < until) {
                const id = model.sample(logits, temp, topK);
                const ch = model.vocab[id];
                if (ch === END || ch === USER || ch === BOT || ch === START || ch === "\n") {
                    n = LIMIT;
                    break;
                }
                text += ch;
                logp += Math.log(Math.max(model.lastProb, 1e-9));
                if (!quiet) {
                    paint(bubble, text);
                }
                logits = model.step(id);
                model.pos++;
                n++;
                if (looping(text)) {
                    n = LIMIT;
                    break;
                }
            }
        } catch (e) {
            console.error(e);
            paint(bubble, text + "  [error: " + e.message + "]");
            finish(text, userText, bubble, started, drafts.length + 1);
            return;
        }
        log.scrollTop = log.scrollHeight;
        layout();
        if (n < LIMIT) {
            setTimeout(tick, 0);
            return;
        }

        drafts.push({ text, mean: text.length ? logp / text.length : -99, agreement: 0 });
        if (drafts.length < wanted) {
            startDraft();
            setTimeout(tick, 0);
            return;
        }
        const best = pickDraft(drafts);
        lastDrafts = drafts;          // what the drafts were, for checking afterwards
        bubble.work = null;           // paint() clears it; forget it so it can come back
        paint(bubble, best.text);
        if (quiet) {
            arrive(bubble.div);
        }
        finish(best.text, userText, bubble, started, wanted);
    }
    startDraft();
    setTimeout(tick, 0);
}

/* The drafts behind the last reply, kept so the choice can be inspected. */
let lastDrafts = [];

function say(text, bad) {
    const note = el("note");
    note.textContent = text;
    note.classList.toggle("bad", !!bad);
}

/* Three lines: JSON header, base85 weights, base85 scales. */
function parseExport(text) {
    const lines = text.split("\n");
    if (lines.length < 3) {
        throw new Error("expected 3 lines, got " + lines.length);
    }
    return { header: JSON.parse(lines[0]), weights: lines[1], scales: lines[2] };
}

/* "855k" -> "855K", "10m1" -> "10.1M", and anything else is not a size at all. */
function prettySize(token) {
    const thousands = /^(\d+)k$/.exec(token);
    if (thousands) {
        return thousands[1] + "K";
    }
    const millions = /^(\d+)m(\d?)$/.exec(token);
    return millions ? millions[1] + (millions[2] ? "." + millions[2] : "") + "M" : null;
}

/* "medium_think_855k_1.3.txt" -> "Medium think 855K". The version belongs on the
   line beneath, with the download size - the name is for telling models apart. */
function shortName(file) {
    const parts = nameParts(file);
    const words = parts.base.split("_");
    const size = prettySize(words[words.length - 1]);
    const family = (size ? words.slice(0, -1) : words).join(" ");
    const name = family.charAt(0).toUpperCase() + family.slice(1);
    return size ? name + " " + size : name + " " + parts.version.join(".");
}

function describe(choice) {
    showFacts([
        ["weights", model.nParams.toLocaleString()],
        ["remembers", model.block + " characters at a time"],
        ["download", choice.size]
    ]);
}

function paintPicker() {
    for (const choice of choices) {
        el("pick-" + choice.key).classList.toggle("active", choice.key === current);
    }
}

/* True once the choice is the model in use, so a caller can fall back if not. */
async function use(choice) {
    if (choice.key === current) {
        return true;
    }
    if (loading || busy) {
        return false;
    }
    const button = el("pick-" + choice.key);
    if (button.classList.contains("off")) {
        say(button.title, true);
        return false;
    }

    loading = true;
    el("send").disabled = true;
    try {
        if (!downloaded[choice.key]) {
            say("Loading " + choice.label + " (" + choice.size + ")…");
            const response = await fetch(FOLDER + choice.file);
            if (!response.ok) {
                throw new Error("the server answered " + response.status);
            }
            downloaded[choice.key] = await response.text();
        }
        say("Getting " + choice.label + " ready…");
        await new Promise(done => setTimeout(done, 0));  // let that message paint
        model = new Peitho(parseExport(downloaded[choice.key]));
        current = choice.key;
        chatTurns = [];
        describe(choice);
        paintPicker();
        say(choice.label + " is ready.");
        setEmpty("Say something to begin.");
        return true;
    } catch (e) {
        console.error(e);
        // The details go to the console; what shows here is what a reader can act on.
        const missing = /404|not found/i.test(e.message);
        say(choice.label + " would not load. "
            + (missing ? "That file is not in the models folder."
                       : "The page could not reach it."), true);
        return false;
    } finally {
        loading = false;
        el("send").disabled = !model;
    }
}

function addChoice(choice, where) {
    choices.push(choice);
    const button = document.createElement("button");
    button.id = "pick-" + choice.key;
    button.innerHTML = choice.label + '<span class="size">' + (choice.note || choice.size)
        + "</span>";
    button.onclick = () => {
        el("more").hidden = true;
        use(choice);
    };
    el(where).append(button);
    return button;
}

/* "medium_think_1.3.txt" -> { base: "medium_think", version: [1, 3] } */
function nameParts(file) {
    const match = /^(.+)_(\d+(?:[.]\d+)*)[.]txt$/.exec(file);
    return match ? { base: match[1], version: match[2].split(".").map(Number) }
                 : { base: file, version: [] };
}

function newerFirst(a, b) {
    for (let i = 0; i < Math.max(a.version.length, b.version.length); i++) {
        const d = (b.version[i] || 0) - (a.version[i] || 0);
        if (d) {
            return d;
        }
    }
    return 0;
}

/* The placeholder is removed as soon as a turn is added, so it may not be there. */
function setEmpty(text) {
    const empty = el("empty");
    if (empty) {
        empty.textContent = text;
    }
}

function cannotLoad(reason) {
    setEmpty(reason);
    el("send").disabled = true;
    say(reason, true);
}

/* Is it there, and how big? Headers only, so looking costs nothing. */
async function weigh(file) {
    try {
        // no-store because this is a folder listing in disguise: a cached 200 for a
        // model that has since been deleted offers a button that cannot load.
        const response = await fetch(FOLDER + file, { method: "HEAD", cache: "no-store" });
        if (!response.ok) {
            return null;
        }
        return Number(response.headers.get("content-length")) || 0;
    } catch (e) {
        return null;
    }
}

/* Ask for every plausible name at once rather than walking a series until it
   seems to end. Versions get deleted - a folder holding only small_1.2 is normal -
   and anything that stops at the first gap would miss what comes after it. */
function names() {
    const all = [];
    for (const base of BASES) {
        for (let major = 1; major <= MAJORS; major++) {
            for (let minor = 0; minor < MINORS; minor++) {
                all.push(base + "_" + major + "." + minor + ".txt");
            }
        }
    }
    return all;
}

/* One greeting from the greeter model, sampled the same way a reply is. */
function composeGreeting() {
    if (!greeter) {
        return "";
    }
    greeter.reset();
    let logits = null;
    for (const ch of START + "\n" + BOT) {
        logits = greeter.step(greeter.stoi[ch]);
        greeter.pos++;
    }
    let text = "";
    for (let i = 0; i < 220; i++) {
        // 0.7 rather than 0.9: measured over 300 samples, 0.9 leaves 1.7% with a
        // mangled word ("I am ha few hundred thousand numbers") for 5% more variety.
        const id = greeter.sample(logits, 0.7, 20);
        const ch = greeter.vocab[id];
        if (ch === END || ch === START || ch === USER || ch === BOT || ch === "\n") {
            break;
        }
        text += ch;
        logits = greeter.step(id);
        greeter.pos++;
    }
    return text.trim();
}

/* Only while the conversation is empty, and never while a reply is being written -
   the greeter and the chat model both want the same few milliseconds. */
function greet(force) {
    const empty = el("empty");
    if (!empty || !greeter || busy || loading || chatTurns.length) {
        return;
    }
    const now = performance.now();
    if (!force && now - greetAt < GREET_EVERY - 500) {
        return;
    }
    greetAt = now;
    const next = composeGreeting();
    if (!next) {
        return;
    }
    empty.classList.add("fading");
    setTimeout(() => {
        const still = el("empty");
        if (still && !chatTurns.length) {
            still.textContent = next;
            still.classList.remove("fading");
        }
    }, 600);
}

async function loadGreeter(files) {
    const found = files.filter(f => f.startsWith(GREETER + "_")).sort();
    if (!found.length) {
        return;
    }
    try {
        const response = await fetch(FOLDER + found[found.length - 1]);
        if (!response.ok) {
            throw new Error("the server answered " + response.status);
        }
        greeter = new Peitho(parseExport(await response.text()));
        greet(true);
        setInterval(() => greet(false), 5000);
    } catch (e) {
        console.error(e);      /* the fixed placeholder stays; nothing else breaks */
    }
}

/* Offer the newest of each strong model up front and the rest behind a button, and
   open the strongest that loads - falling back to Small only if none of them do. */
async function findModels() {
    if (typeof fetch !== "function") {
        cannotLoad("This page reads its model from the " + FOLDER + " folder, and this "
                   + "browser will not let it fetch files.");
        return;
    }
    if (location.protocol === "file:") {
        cannotLoad("Opened straight from the disk, a page cannot read the files beside it, "
                   + "so the " + FOLDER + " folder is out of reach. Serve the folder instead: "
                   + "py -m http.server, then open localhost:8000/peitho.html.");
        return;
    }

    const candidates = names();
    const sizes = await Promise.all(candidates.map(weigh));
    const found = [];
    for (let i = 0; i < candidates.length; i++) {
        if (sizes[i] !== null) {
            found.push({ file: candidates[i], bytes: sizes[i] });
        }
    }
    if (!found.length) {
        cannotLoad("Nothing in the " + FOLDER + " folder yet. Train a model and it will "
                   + "appear here.");
        return;
    }

    loadGreeter(found.map(entry => entry.file));
    const models = found
        .filter(entry => !entry.file.startsWith(GREETER + "_"))   /* it greets; it cannot answer */
        .map(entry => Object.assign({
            key: entry.file.replace(/[^A-Za-z0-9]/g, "_"),
            label: shortName(entry.file),
            size: (entry.bytes / 1048576).toFixed(1) + " MB",
            file: entry.file,
            bytes: entry.bytes
        }, nameParts(entry.file)))
        .map(choice => Object.assign(choice, {
            note: "v" + choice.version.join(".") + " · " + choice.size
        }));

    let main = [];
    for (const base of STRONG) {
        const versions = models.filter(c => c.base === base).sort(newerFirst);
        if (versions.length) {
            main.push(versions[0]);
        }
    }
    let rest = models.filter(c => !main.includes(c))
                     .sort((a, b) => b.bytes - a.bytes || newerFirst(a, b));
    if (!main.length) {      /* no strong model at all: offer what there is up front */
        main = rest;
        rest = [];
    }
    main.forEach(c => addChoice(c, "picker"));
    rest.forEach(c => addChoice(c, "picker-more"));
    el("more-open").hidden = !rest.length;
    paintPicker();

    for (const choice of main) {
        if (await use(choice)) {
            return;
        }
    }
    const fallback = rest.filter(c => c.base === FALLBACK).sort(newerFirst)
        .concat(rest.filter(c => c.base !== FALLBACK).sort((a, b) => a.bytes - b.bytes));
    for (const choice of fallback) {
        if (await use(choice)) {
            say("Opened " + choice.label + " instead - " + main[0].label + " would not load.", true);
            return;
        }
    }
}

function showFacts(rows) {
    const box = el("facts");
    box.innerHTML = "";
    for (const [name, value] of rows) {
        const line = document.createElement("div");
        const left = document.createElement("span");
        const right = document.createElement("span");
        left.textContent = name;
        right.textContent = value;
        line.append(left, right);
        box.append(line);
    }
}

/* Roughly what the wordmark occupies: its max-height plus its margin. */
const HEADER_SPACE = 110;
let idle = null;
let grabbed = null;

/* How tall the conversation actually is. Measured from the turns rather than from
   the log, because the log grows to fill whatever the wordmark gives up - judging
   by the container would mean hiding the wordmark could make the content appear
   to fit, which would show it again, which would take the space back. */
function contentHeight() {
    const turns = log.children;
    if (!turns.length) {
        return 0;
    }
    const top = turns[0].getBoundingClientRect().top;
    const bottom = turns[turns.length - 1].getBoundingClientRect().bottom;
    return bottom - top;
}

/* The wordmark goes exactly when a scrollbar is needed and not merely when the
   chat is tall: both are decided by whether the turns outgrow the space left for
   them once the wordmark is out of the way. */
function layout() {
    const rail = el("rail");
    const thumb = el("thumb");
    const space = el("reader").clientHeight
        + (el("header").classList.contains("receded") ? 0 : HEADER_SPACE);
    el("header").classList.toggle("receded", contentHeight() > space - HEADER_SPACE);

    const room = log.scrollHeight - log.clientHeight;
    rail.classList.toggle("shown", room > 0);
    if (room <= 0) {
        return;
    }
    const track = rail.clientHeight;
    const height = Math.max(28, track * log.clientHeight / log.scrollHeight);
    thumb.style.height = height + "px";
    thumb.style.top = (track - height) * (log.scrollTop / room) + "px";
}

/* Grow to a normal width while the view is moving, then thin back to a line. */
function wake() {
    el("rail").classList.add("awake");
    clearTimeout(idle);
    idle = setTimeout(() => {
        if (grabbed === null) {
            el("rail").classList.remove("awake");
        }
    }, 900);
}

function drag(e) {
    if (grabbed === null) {
        return;
    }
    const track = el("rail").getBoundingClientRect();
    const height = el("thumb").offsetHeight;
    const span = track.height - height;
    const top = Math.min(Math.max(e.clientY - track.top - grabbed, 0), span);
    log.scrollTop = span ? (top / span) * (log.scrollHeight - log.clientHeight) : 0;
}

function init() {
    log = el("log");

    el("send").onclick = () => {
        const box = el("msg");
        const v = box.value.trim();
        if (v) {
            box.value = "";
            reply(v);
        }
    };
    el("msg").addEventListener("keydown", e => {
        if (e.key === "Enter") {
            el("send").click();
        }
    });
    el("clear").onclick = () => {
        chatTurns = [];
        painted.length = 0;
        log.innerHTML = '<div class="empty" id="empty">Say something to begin.</div>';
        el("stats").textContent = "";
        layout();
        greet(true);
    };
    el("gear").onclick = e => {
        e.stopPropagation();
        const box = el("settings");
        box.hidden = !box.hidden;
        el("more").hidden = true;
        el("effort").hidden = true;
    };
    buildSlider();
    el("dial").onclick = e => {
        e.stopPropagation();
        const box = el("effort");
        box.hidden = !box.hidden;
        el("settings").hidden = true;
        el("more").hidden = true;
    };
    el("more-open").onclick = () => {
        el("more").hidden = false;
    };
    el("more-close").onclick = () => {
        el("more").hidden = true;
    };
    document.addEventListener("click", e => {
        const box = el("settings");
        if (!box.hidden && !box.contains(e.target) && e.target !== el("gear")) {
            box.hidden = true;
            el("more").hidden = true;
        }
        const dial = el("effort");
        if (!dial.hidden && !dial.contains(e.target) && e.target !== el("dial")) {
            dial.hidden = true;
        }
    });
    el("temp").oninput = function () {
        el("tempv").textContent = parseFloat(this.value).toFixed(2);
    };
    el("working").onchange = repaintAll;
    el("topk").oninput = function () {
        el("topkv").textContent = this.value;
    };
    window.addEventListener("resize", layout);
    log.addEventListener("scroll", () => {
        layout();
        wake();
    });
    el("thumb").addEventListener("pointerdown", e => {
        grabbed = e.clientY - el("thumb").getBoundingClientRect().top;
        el("thumb").setPointerCapture(e.pointerId);
        el("rail").classList.add("awake");
        e.preventDefault();
    });
    el("thumb").addEventListener("pointermove", drag);
    el("thumb").addEventListener("pointerup", e => {
        grabbed = null;
        el("thumb").releasePointerCapture(e.pointerId);
        wake();
    });
    el("rail").addEventListener("pointerdown", e => {
        if (e.target === el("rail")) {
            const track = el("rail").getBoundingClientRect();
            const to = (e.clientY - track.top) / track.height;
            log.scrollTop = to * (log.scrollHeight - log.clientHeight);
        }
    });

    el("send").disabled = true;
    setEmpty("Getting ready…");
    findModels();
}

let started = false;
function start() {
    if (started) {
        return;
    }
    started = true;
    try {
        init();
    } catch (e) {
        console.error(e);
        const empty = el("empty");
        if (empty) {
            empty.textContent = "startup failed: " + e.message;
        }
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
    window.addEventListener("load", start);
} else {
    start();
}
</script>
    </body>
</html>
